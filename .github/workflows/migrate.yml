name: Run Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  # Lets us run migrations on demand, e.g. to re-apply after a failure without
  # having to push a dummy migration.
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # We connect straight to Postgres instead of running `supabase link`.
      # `link` calls GET /v1/projects/{ref}/api-keys?reveal=true, which a scoped
      # access token is not allowed to do, so it fails with a privileges error
      # even when the token can run migrations perfectly well.
      #
      # Port 5432 on the pooler is session mode — required, because `db push`
      # takes advisory locks that the transaction pooler (6543) doesn't support.
      # The runner is IPv4-only, so the direct db.<ref>.supabase.co host is not
      # an option either.
      - name: Run migrations
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          ENCODED_PASSWORD=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENCODED_PASSWORD}@aws-1-us-east-2.pooler.supabase.com:5432/postgres"
          # Never echo DB_URL — it carries the password.
          supabase db push --db-url "$DB_URL" --skip-vault --yes
